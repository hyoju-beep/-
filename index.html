<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>

<style>
:root{
  --bg:#f5f1eb;
  --surface:#ffffff;
  --surface2:#f0eae3;
  --border:rgba(0,0,0,0.06);
  --text:#3e3a37;
  --muted:#9c928a;

  --accent:#c8a97e;
  --accent2:#e6c7a1;
  --accent-dark:#a88a62;
  --btn-fg:#ffffff;

  --c1:#c8a97e; /* 체크 */
  --c2:#8fa89e;
  --c3:#b5a6c9;
  --c4:#c9b29b;
  --c5:#cdb4db; /* 문화 */
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

.box{
  background:var(--surface);
  padding:16px;
  border-radius:12px;
  margin-bottom:12px;
}

input, select{
  padding:8px;
  margin-right:6px;
}

button{
  padding:8px 12px;
  cursor:pointer;
}

.todo{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.cat{
  font-size:12px;
}

/* 카테고리 색 */
.cat[data-cat="check"]{color:var(--c1);}
.cat[data-cat="study"]{color:var(--c2);}
.cat[data-cat="health"]{color:var(--c3);}
.cat[data-cat="daily"]{color:var(--c4);}
.cat[data-cat="job"]{color:#d6a5a5;}
.cat[data-cat="culture"]{color:var(--c5);}
</style>
</head>

<body>

<h2>📌 나의 플래너</h2>

<div class="box">
  <input id="todoInput" placeholder="할 일 입력">
  
  <select id="cat">
    <option value="check">✔️ 체크</option>
    <option value="study">📚 공부</option>
    <option value="health">🏃 운동</option>
    <option value="daily">🌿 일상</option>
    <option value="job">💼 취준</option>
    <option value="culture">🎨 문화</option>
  </select>

  <button onclick="addTodo()">추가</button>
</div>

<div id="list"></div>

<script>
const EMOJIS={
  check:'✔️',
  study:'📚',
  health:'🏃',
  daily:'🌿',
  job:'💼',
  culture:'🎨'
};

let todos=[];

function render(){
  const list=document.getElementById('list');
  list.innerHTML='';
  todos.forEach((t,i)=>{
    list.innerHTML+=`
      <div class="box todo">
        <input type="checkbox" ${t.done?'checked':''} onclick="toggle(${i})">
        <span>${t.text}</span>
        <span class="cat" data-cat="${t.cat}">
          ${EMOJIS[t.cat]}
        </span>
        <button onclick="del(${i})">삭제</button>
      </div>
    `;
  });
}

function addTodo(){
  const input=document.getElementById('todoInput');
  const cat=document.getElementById('cat').value;

  if(!input.value.trim()) return;

  todos.push({
    text:input.value,
    cat:cat,
    done:false
  });

  input.value='';
  render();
}

function toggle(i){
  todos[i].done=!todos[i].done;
  render();
}

function del(i){
  todos.splice(i,1);
  render();
}
</script>

</body>
</html>
